jdk:
  - openjdk17
before_install:
  - sdk install java 17.0.10-open
  - sdk use java 17.0.10-open
install:
  # Publish ONLY the native Android SDK module to JitPack.
  # The React Native and Flutter bridges are published to npm / pub, not JitPack,
  # and they depend on this module, so building them here would be circular.
  - ./gradlew :mobileSDK:clean :mobileSDK:assembleRelease :mobileSDK:publishReleasePublicationToMavenLocal
